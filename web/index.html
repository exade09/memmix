<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>MIXBORN — Two tokens in. One born.</title>
    <meta
      name="description"
      content="Mix the logic behind two Solana tokens into one new character, then launch it on Pump. Non-custodial: nothing is signed until you sign it."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      BORN sits in the hero bench, but the <img> only exists once a 1.4 MB
      bundle has parsed. Preloading starts the fetch during HTML parse instead,
      so the art is cached before React mounts and the SVG fallback never has
      to stand in. The same file is used on every route.
    -->
    <link rel="preload" as="image" href="/assets/brand/born-portrait.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
