<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>MIXBORN — Two tokens in. One born.</title>
    <meta
      name="description"
      content="Mix the logic behind two Solana tokens into one new character, then launch it on Pump. Non-custodial: nothing is signed until you sign it."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The hero figure is the first thing the landing page is about, but the
      <img> only exists once a 1.4 MB bundle has parsed. Preloading starts the
      116 KB fetch during HTML parse instead, so the art is already cached when
      React mounts. App routes pay one unused request for it; the landing is
      where first impressions happen.
    -->
    <link rel="preload" as="image" href="/assets/brand/born-full.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
